# 광고 운영 주간 리포트 메일 — 매주 월요일 06:00 KST (일요일 21:00 UTC)
# 저장 위치: .github/workflows/daily_report.yml

name: weekly-report

on:
  schedule:
    - cron: '0 21 * * 0'   # 일요일 21:00 UTC = 월요일 06:00 KST
  workflow_dispatch:        # 수동 실행 (테스트용)

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install cryptography

      - name: Send daily report
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          IMWEB_DASH_PASSWORD: ${{ secrets.IMWEB_DASH_PASSWORD }}
          MAIL_USER: support@sunamfarmers.kr      # 앱 비밀번호를 발급한 구글 계정
          REPORT_TO: official@sunamfarmers.kr     # 리포트 받는 주소
        run: python send_daily_report.py
